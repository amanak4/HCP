# Minimal laptop Slurm cluster. cgroup plugins are avoided so nodes
# register cleanly inside Docker without host cgroup v2 privileges.
ClusterName=hcp
SlurmctldHost=slurmctld(172.28.0.10)
MpiDefault=none
AuthType=auth/munge
CryptoType=crypto/munge
ProctrackType=proctrack/pgid
ReturnToService=2
SlurmctldPidFile=/var/spool/slurmctld/slurmctld.pid
SlurmdPidFile=/var/spool/slurmd/slurmd.pid
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmUser=slurm
SlurmdUser=root
TaskPlugin=task/none
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory
AccountingStorageType=accounting_storage/none
JobAcctGatherType=jobacct_gather/none
MailProg=/bin/true
MinJobAge=600
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldPort=6817
SlurmdPort=6818

NodeName=c1 NodeAddr=172.28.0.11 CPUs=2 RealMemory=1000 Sockets=1 CoresPerSocket=2 ThreadsPerCore=1 State=UNKNOWN
NodeName=c2 NodeAddr=172.28.0.12 CPUs=2 RealMemory=1000 Sockets=1 CoresPerSocket=2 ThreadsPerCore=1 State=UNKNOWN
PartitionName=compute Nodes=c1,c2 Default=YES MaxTime=INFINITE State=UP
