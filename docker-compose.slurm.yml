services:
  slurmctld:
    build:
      context: ./clusters/slurm
    image: hcp-slurm:local
    pull_policy: never
    container_name: hcp-slurmctld
    hostname: slurmctld
    environment:
      SLURM_ROLE: controller
    volumes:
      - munge-key:/shared/munge
      - slurm-data:/data
    ports:
      - "6817:6817"
    networks:
      slurm:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "scontrol ping | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  c1:
    image: hcp-slurm:local
    pull_policy: never
    container_name: hcp-c1
    hostname: c1
    privileged: true
    environment:
      SLURM_ROLE: compute
    volumes:
      - munge-key:/shared/munge
      - slurm-data:/data
    depends_on:
      - slurmctld
    mem_limit: 2g
    cpus: 2.0
    networks:
      slurm:
        ipv4_address: 172.28.0.11

  c2:
    image: hcp-slurm:local
    pull_policy: never
    container_name: hcp-c2
    hostname: c2
    privileged: true
    environment:
      SLURM_ROLE: compute
    volumes:
      - munge-key:/shared/munge
      - slurm-data:/data
    depends_on:
      - slurmctld
    mem_limit: 2g
    cpus: 2.0
    networks:
      slurm:
        ipv4_address: 172.28.0.12

volumes:
  munge-key:
  slurm-data:

networks:
  slurm:
    ipam:
      config:
        - subnet: 172.28.0.0/24
